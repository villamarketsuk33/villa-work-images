<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ภาพเมนูงาน · Villa Market</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#153b70;font:16px/1.6 system-ui,sans-serif}
  main{max-width:1040px;margin:auto;padding:28px 20px 40px}header{border-top:5px solid #bc2940;padding-top:20px}
  h1{font-size:28px;line-height:1.35;margin:0 0 6px}header p{margin:0 0 24px;color:#68758a}
  .setup{background:white;border-radius:16px;padding:20px;margin:20px 0}.setup p{margin:8px 0}
  label{display:block;font-weight:700}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:14px monospace;color:#153b70}
  button{margin-top:12px;background:#bc2940;color:white;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
  #status{min-height:1.6em;color:#486258;font-size:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
  article{background:white;border-radius:16px;overflow:hidden;padding:14px;box-shadow:0 4px 18px #163a7010;border-top:5px solid #153b70}
  img{width:100%;height:76px;object-fit:contain;background:#f0f4fa;border-radius:12px;display:block}
  h2{font-size:21px;line-height:1.35;margin:16px 0 4px}article p{font-size:14px;color:#68758a;margin:0 0 12px}
  a{color:#bc2940;font-size:14px}footer{font-size:13px;color:#68758a;margin-top:24px}
</style>
<main>
  <header><h1>ภาพเมนูงาน Villa Market</h1><p>ภาพประกอบสำหรับการ์ดงานทั้ง 6 หัวข้อ</p></header>
  <section class="setup">
    <label for="base">ลิงก์โฟลเดอร์รูปสำหรับตั้งค่าในบอท</label>
    <p>คัดลอกลิงก์นี้ไปใส่ใน Script Property ชื่อ <strong>VM_WORK_MENU_IMAGE_BASE_URL</strong></p>
    <input id="base" readonly aria-label="ลิงก์โฟลเดอร์รูป"><button id="copy" type="button">คัดลอกลิงก์</button><p id="status" role="status"></p>
  </section>
  <section class="cards" aria-label="รูปภาพแต่ละหัวข้อ"><!-- GALLERY_CARDS --></section>
  <footer>ภาพบนหน้านี้เป็นแกลเลอรีสำหรับตั้งค่าบอท การกดใช้งานจริงอยู่ในการ์ดที่บอทส่งใน LINE</footer>
</main>
<script>
const input=document.getElementById('base');
input.value=new URL('images/',location.href).href.replace(/\/$/,'');
document.getElementById('copy').addEventListener('click',async()=>{
  input.focus();input.select();
  try{await navigator.clipboard.writeText(input.value);document.getElementById('status').textContent='คัดลอกแล้ว';}
  catch{document.getElementById('status').textContent='เลือกลิงก์ไว้แล้ว กรุณาคัดลอกด้วยเมนูของอุปกรณ์';}
});
</script>
</html>
